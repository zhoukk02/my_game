# Rustfmt 配置文件
# 用于控制 Rust 代码的格式化风格

# 最大行宽：当一行代码超过该字符数时，rustfmt 会尝试换行
# 默认值: 100
max_width = 100

# 链式调用换行阈值：当链式调用的总长度超过该值时，每个方法调用会单独成行
# 默认值: 60
# 设置为较小值（如 40）可让长链更早换行，提高可读性
chain_width = 60

# 函数链（或同一行内的多次方法调用）中，单个函数调用触发行宽阈值
# 当单个方法调用（含参数）的长度超过该值时，可能会被强制换行
# 默认值: 60
# 可选配置，若不需要可删除或注释掉
fn_call_width = 60
