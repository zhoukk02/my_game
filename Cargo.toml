[package]
name = "my_game"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

bevy = { version = "0.18", default-features = false, features = ["2d", "dev"] }

bevy_kira_audio = { version = "0.25" }
bevy_aseprite_ultra = { version = "0.8.2" }

bevy_asset_loader = "0.26"
bevy_common_assets = { version = "0.15", features = ["ron"] }

leafwing-input-manager = { version = "0.20" }

avian2d = { version = "0.5" }
bevy_ecs_tiled = { version = "0.11", features = [
    "debug",
    "avian",
    "user_properties",
] }
